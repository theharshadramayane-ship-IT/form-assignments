<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #3b82f6; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .nav-link { position: absolute; top: 20px; left: 20px; color: #fff; text-decoration: none; font-weight: bold; }
        .form-container {
            background: #fff; padding: 40px; border-radius: 10px; width: 100%; max-width: 800px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h2 { margin-top: 0; color: #333; font-size: 24px; }
        h3 { color: #666; font-size: 16px; margin-bottom: 15px; font-weight: normal; border-bottom: 1px solid #eee; padding-bottom: 5px;}
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 30px;}
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 12px; color: #555; margin-bottom: 5px; font-weight: bold; }
        .form-group input {
            padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; color: #333;
        }
        .form-group input:focus { outline: none; border-color: #3b82f6; }
        .btn-next {
            background: #3b82f6; color: white; border: none; padding: 12px 30px; border-radius: 5px;
            font-size: 16px; cursor: pointer; font-weight: bold; display: inline-block;
        }
        .btn-next:hover { background: #2563eb; }
        @media (max-width: 768px) { .grid-3 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <a href="index.html" class="nav-link">← Back to Menu</a>
    <div class="form-container">
        <h2>Registration</h2>
        
        <h3>Personal Details</h3>
        <div class="grid-3">
            <div class="form-group"><label>Full Name</label><input type="text" placeholder="Enter your name"></div>
            <div class="form-group"><label>Date of Birth</label><input type="date"></div>
            <div class="form-group"><label>Email</label><input type="email" placeholder="Enter your email"></div>
            <div class="form-group"><label>Mobile number</label><input type="tel" placeholder="Enter mobile number"></div>
            <div class="form-group"><label>Gender</label><input type="text" placeholder="Enter your gender"></div>
            <div class="form-group"><label>Occupation</label><input type="text" placeholder="Enter occupation"></div>
        </div>

        <h3>Identity Details</h3>
        <div class="grid-3">
            <div class="form-group"><label>ID Type</label><input type="text" placeholder="Enter ID type"></div>
            <div class="form-group"><label>ID Number</label><input type="text" placeholder="Enter ID number"></div>
            <div class="form-group"><label>Issue Authority</label><input type="text" placeholder="Enter issue department"></div>
            <div class="form-group"><label>Issue Date</label><input type="date"></div>
            <div class="form-group"><label>Issue State</label><input type="text" placeholder="Enter ID issue state"></div>
            <div class="form-group"><label>Expiry Date</label><input type="date"></div>
        </div>
        <button class="btn-next">Next →</button>
    </div>
</body>
</html>
