<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back</title>
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #8fa32e;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .nav-link { position: absolute; top: 20px; left: 20px; color: #fff; text-decoration: none; font-weight: bold; }
        .card { background: #fff; display: flex; width: 900px; height: 500px; border-radius: 20px; overflow: hidden; box-shadow: 0 15px 30px rgba(0,0,0,0.3);}
        .left { flex: 1; background: #0e4b5c; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; text-align: center; border-top-right-radius: 200px; border-bottom-right-radius: 200px;}
        .left h2 { font-size: 32px; margin-bottom: 15px; }
        .left p { font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
        .btn-signin { background: transparent; color: white; border: 1px solid white; padding: 10px 40px; border-radius: 5px; font-size: 16px; cursor: pointer;}
        .btn-signin:hover { background: white; color: #0e4b5c; }
        .right { flex: 1; padding: 50px; display: flex; flex-direction: column; justify-content: center;}
        .right h2 { font-size: 28px; margin-bottom: 20px; text-align: center; color: #333;}
        .social-icons { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;}
        .social-icons span { border: 1px solid #ccc; padding: 8px 12px; border-radius: 5px; font-weight: bold; color: #555; cursor: pointer;}
        .divider { text-align: center; margin: 15px 0; font-weight: bold; color: #777;}
        .form-group { margin-bottom: 15px; }
        .form-group input { width: 100%; padding: 12px; border: none; background: #e0e0e0; border-radius: 5px; font-size: 14px; box-sizing: border-box;}
        .form-group input:focus { outline: 2px solid #8fa32e; }
        .btn-signup { background: #b5cc22; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;}
        .btn-signup:hover { background: #9eb51c; }
    </style>
</head>
<body>
    <a href="index.html" class="nav-link">← Back to Menu</a>
    <div class="card">
        <div class="left">
            <h2>Welcome Back!</h2>
            <p>Provide your personal details to use all features</p>
            <button class="btn-signin">SIGN IN</button>
        </div>
        <div class="right">
            <h2>Register With</h2>
            <div class="social-icons">
                <span>G+</span><span>f</span><span>in</span>
            </div>
            <div class="divider">OR</div>
            <div style="font-size: 12px; color: #777; margin-bottom: 15px; text-align: center;">Fill Out The Following Info For Registration</div>
            <form>
                <div class="form-group"><input type="text" placeholder="Name" required></div>
                <div class="form-group"><input type="email" placeholder="Email" required></div>
                <div class="form-group"><input type="password" placeholder="Password" required></div>
                <button type="submit" class="btn-signup">SIGN UP</button>
            </form>
        </div>
    </div>
</body>
</html>
